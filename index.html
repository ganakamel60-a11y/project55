<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة الطقس — Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky-wash" id="skyWash" aria-hidden="true"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">☁</span>
      <span class="brand-name">لوحة الطقس</span>
    </div>

    <form class="search" id="searchForm" autocomplete="off">
      <input
        type="text"
        id="cityInput"
        placeholder="ابحث عن مدينة… (مثلاً: القاهرة)"
        aria-label="اسم المدينة"
      />
      <button type="submit" aria-label="بحث">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button type="button" id="geoBtn" class="geo-btn" title="طقس موقعي الحالي" aria-label="طقس موقعي الحالي">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
      </button>
    </form>

    <div class="recent" id="recentCities" aria-label="آخر المدن التي تم البحث عنها"></div>
  </header>

  <main id="mainContent">

    <div class="status-banner" id="statusBanner" role="alert" hidden></div>

    <div class="loading" id="loadingState" hidden>
      <div class="spinner"></div>
      <p>جارِ إحضار بيانات الطقس…</p>
    </div>

    <section class="hero-card" id="heroCard" hidden>
      <div class="hero-left">
        <p class="hero-eyebrow" id="heroDate">—</p>
        <h1 class="hero-city" id="heroCity">—</h1>
        <p class="hero-desc" id="heroDesc">—</p>
        <div class="hero-temp-row">
          <span class="hero-icon" id="heroIcon">☀</span>
          <span class="hero-temp" id="heroTemp">--°</span>
        </div>
        <p class="hero-feels" id="heroFeels">—</p>
      </div>
      <div class="hero-right">
        <div class="stat">
          <span class="stat-label">الرطوبة</span>
          <span class="stat-value" id="statHumidity">--%</span>
        </div>
        <div class="stat">
          <span class="stat-label">سرعة الرياح</span>
          <span class="stat-value" id="statWind">-- كم/س</span>
        </div>
        <div class="stat">
          <span class="stat-label">الضغط الجوي</span>
          <span class="stat-value" id="statPressure">-- hPa</span>
        </div>
        <div class="stat">
          <span class="stat-label">الرؤية</span>
          <span class="stat-value" id="statVisibility">-- كم</span>
        </div>
      </div>
    </section>

    <section class="forecast" id="forecastSection" hidden>
      <h2 class="forecast-title">توقعات الأيام القادمة</h2>
      <div class="forecast-strip" id="forecastStrip"></div>
    </section>

    <section class="empty-state" id="emptyState">
      <span class="empty-icon">🌤</span>
      <h2>ابحث عن مدينة لعرض حالة الطقس</h2>
      <p>اكتب اسم أي مدينة في العالم، أو استخدم زر الموقع لجلب طقس مكانك الحالي.</p>
    </section>

  </main>

  <footer class="page-footer">
    مدعوم من بيانات <a href="https://openweathermap.org/" target="_blank" rel="noopener">OpenWeatherMap</a>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
